name: Fabric 1.21.11 Backport Build
on:
  push:
    branches: [ "fabric-1.21.11" ]
  pull_request:
    branches: [ "fabric-1.21.11" ]
  workflow_dispatch:

jobs:
  build:
    name: Build 1.21.11 Fabric Jar (GitHub-only, no local build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 21 (MC 1.21.11)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-1.21.11-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew spotlessApply build --stacktrace --no-daemon

      - name: Clean Extra Artifacts
        run: |
          rm build/libs/*-sources.jar build/libs/*-dev.jar || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: radial-fabric-1.21.11-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
